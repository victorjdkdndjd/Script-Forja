name: Apply native Forja v3.5 integration

on:
  push:
    branches: [native-editor-integration]
    paths: ['.github/workflows/apply-native-v35.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply and validate native editor patch
        run: python3 tools/apply_native_v35.py
      - name: Commit native working version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decoded-scripts.html legacy.html index.html native-v35-report.json
          git commit -m "feat: integrar novas opções nativamente em QUANDO SE ENTÃO"
          git push
