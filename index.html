<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forja — Scripts e Componentes</title>
<style>
:root{ --bar-h:54px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#15161B}
#bar{
  position:fixed;top:0;left:0;right:0;height:var(--bar-h);z-index:10;
  display:flex;align-items:center;gap:8px;padding:0 10px;
  border-bottom:1px solid var(--bar-line);background:var(--bar-bg);
  transition:background .22s ease,border-color .22s ease;
}
#logo{
  font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--bar-mut);flex:none;border-right:1px solid var(--bar-line);
  height:26px;display:flex;align-items:center;padding-right:10px;
}
#tabs{display:flex;gap:6px;flex:1;min-width:0}
#tabs button{
  flex:1;min-width:0;height:36px;border-radius:7px;cursor:pointer;
  border:1px solid var(--bar-line);background:var(--tab-bg);color:var(--bar-mut);
  font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:7px;
  overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  transition:background .18s,color .18s,border-color .18s;
}
#tabs button .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.45;flex:none}
#tabs button[aria-selected="true"]{background:var(--tab-on);color:var(--tab-on-txt);border-color:var(--tab-on-line);font-weight:700}
#tabs button[aria-selected="true"] .dot{opacity:1;color:var(--accent)}
#lang{
  flex:none;height:36px;min-width:46px;border-radius:7px;cursor:pointer;
  border:1px solid var(--bar-line);background:var(--tab-bg);color:var(--bar-mut);
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;font-weight:700;
}
#lang:active{color:var(--tab-on-txt);border-color:var(--accent)}
body[data-skin="scripts"]{
  --bar-bg:#DCCDAD;--bar-line:#A08E68;--bar-mut:#6B5C40;
  --tab-bg:rgba(255,248,232,.35);--tab-on:#EDE3CE;--tab-on-txt:#2A2317;--tab-on-line:#2A2317;
  --accent:#B32E28; background:#EDE3CE;
}
body[data-skin="vida"]{
  --bar-bg:#DCCDAD;--bar-line:#A08E68;--bar-mut:#6B5C40;
  --tab-bg:rgba(255,248,232,.35);--tab-on:#EDE3CE;--tab-on-txt:#2A2317;--tab-on-line:#2A2317;
  --accent:#B32E28; background:#EDE3CE;
}
#stack{position:fixed;top:var(--bar-h);left:0;right:0;bottom:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:transparent}
iframe.on{display:block}
#load{
  position:absolute;inset:0;display:none;place-items:center;
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--bar-mut);
}
#load.on{display:grid}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-skin="scripts">

<script>
const stack = document.getElementById("stack");
const load = document.getElementById("load");
const frames = {};
let LANG = "pt";

const T = {
  pt: { scripts: "Scripts", vida: "Componentes", load: "carregando\u2026", btn: "EN", title: "Trocar idioma" },
  en: { scripts: "Scripts", vida: "Components", load: "loading\u2026", btn: "PT", title: "Switch language" }
};

function decode(id) {
  const b64 = document.getElementById("src-" + id).textContent.trim();
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder("utf-8").decode(bytes);
}

function tellFrame(f) {
  try { f.contentWindow.postMessage({ fvLang: LANG }, "*"); } catch (e) {}
  try { if (f.contentWindow.__setLang) f.contentWindow.__setLang(LANG); } catch (e) {}
}

function applyShell() {
  const t = T[LANG];
  document.querySelectorAll("#tabs button").forEach(b => { b.querySelector("span").textContent = t[b.dataset.app]; });
  load.textContent = t.load;
  const lb = document.getElementById("lang");
  lb.textContent = t.btn;
  lb.setAttribute("title", t.title);
  document.documentElement.lang = LANG === "en" ? "en" : "pt-BR";
}

function show(id) {
  document.body.dataset.skin = id;
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.app === id)));
  Object.keys(frames).forEach(k => frames[k].classList.toggle("on", k === id));
  if (frames[id]) return;
  load.classList.add("on");
  setTimeout(() => {
    const f = document.createElement("iframe");
    f.setAttribute("allow", "clipboard-write; clipboard-read");
    f.srcdoc = decode(id);
    f.onload = () => { load.classList.remove("on"); setTimeout(() => tellFrame(f), 60); };
    stack.appendChild(f);
    frames[id] = f;
    f.classList.add("on");
  }, 20);
}

document.getElementById("tabs").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (b) show(b.dataset.app);
});

document.getElementById("lang").addEventListener("click", () => {
  LANG = LANG === "pt" ? "en" : "pt";
  applyShell();
  Object.keys(frames).forEach(k => tellFrame(frames[k]));
});

applyShell();
show("scripts");
</script>
