<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#11131a">
  <title>Script Forja v3.4.1</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#0d0f14;overflow:hidden}
    #forjaLegacy{display:block;width:100%;height:100%;border:0;background:#0d0f14}
  </style>
</head>
<body>
  <iframe id="forjaLegacy" src="./legacy.html?v=3.4.1" title="Script Forja v3.4.1"></iframe>
  <script>
  (()=>{
    const frame=document.getElementById('forjaLegacy');
    const fix=()=>{
      try{
        const d=frame.contentDocument;
        if(!d)return;
        const badge=d.getElementById('site-version');
        if(badge) badge.textContent='v3.4.1';
        d.title='Forja v3.4.1 — Scripts e Componentes';
      }catch{}
    };
    frame.addEventListener('load',()=>{fix();setTimeout(fix,100);setTimeout(fix,800)});
    setInterval(fix,1500);
  })();
  </script>
  <script src="./forja.js?v=3.4.1"></script>
</body>
</html>
